<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Appointment Managment  System</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>
<body class="page">
    <div class="page-card">
        <h1 >Login</h1>
        <p class="subtitle">Login to manage your appointments</p>
         {% with messages = get_flashed_messages(with_categories=true)%}
    {% if messages %}
    {%for category ,message in messages %}
    <div class="flash {{category}}"> 
        {{message}} 
    </div>
    {%endfor%} 
    {%endif%}
    {%endwith%}
     <form action="/login" method="POST" class="form"> 

        <div class="form-grp"> <label for="email">Email</label> <input type="text" id="email" name="email"  placeholder="Enter your email"> <br> </div>
        <div class="form-grp"> <label for="password">Password</label> <input type="password" id="password"  name="password"  placeholder="Enter your password" required> <br> </div>
         <button type="submit"  class="btn"> login  </button>
         </form>
         <p class="text" >  Don't have an account? <a href="{{url_for('Register')}}"> Register here </a> </p>
        </div>
        <script src="{{url_for('static',filename='script.js')}}"> </script>    

</body>
</html>
